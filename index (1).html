<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StepUp English 🗒️ | 30-Day Roadmap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;

      --sun-btn-bg: #facc15;
      --sun-btn-border: #eab308;
      --motivate-border: #1d4ed8;
      --motivate-bg: #a7f3d0;
      --cloud-fill: #2563eb;
      --cloud-hover: #1d4ed8;
      --cloud-stroke: #000000;
    }

    body.dark-mode {
      --bg-body: #111827;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --card-bg: #1f2937;
      --card-border: #374151;

      --sun-btn-bg: #6b7280;
      --sun-btn-border: #4b5563;
      --motivate-border: #3b82f6;
      --motivate-bg: #134e4a;
      --cloud-fill: #1e40af;
      --cloud-hover: #1d4ed8;
      --cloud-stroke: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      transition: background-color 0.25s ease, color 0.25s ease;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    .top-bar {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 20px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-logo {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background-color: var(--sun-btn-bg);
      border: 2.5px solid var(--sun-btn-border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s ease, background-color 0.25s ease;
    }

    .theme-btn:hover {
      transform: scale(1.08);
    }

    .home-view {
      max-width: 680px;
      margin: 16px auto 0;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
    }

    .home-view.hidden {
      display: none !important;
    }

    .motivation-box {
      width: 100%;
      border: 3.5px solid var(--motivate-border);
      background: linear-gradient(135deg, var(--motivate-bg) 0%, #bae6fd 100%);
      border-radius: 22px;
      padding: 26px 22px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(29, 78, 216, 0.12);
    }

    body.dark-mode .motivation-box {
      background: linear-gradient(135deg, #134e4a 0%, #1e3a8a 100%);
    }

    .motivation-box h2 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 10px;
    }

    body.dark-mode .motivation-box h2 {
      color: #ffffff;
    }

    .motivation-box p.encourage-text {
      font-family: 'Cairo', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: #064e3b;
      direction: rtl;
      line-height: 1.6;
    }

    body.dark-mode .motivation-box p.encourage-text {
      color: #a7f3d0;
    }

    .clouds-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-top: 4px;
    }

    .cloud-btn {
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
      width: 310px;
      max-width: 92%;
      height: 125px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.22s ease;
    }

    .cloud-btn:hover {
      transform: translateY(-4px) scale(1.03);
    }

    .cloud-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      fill: var(--cloud-fill);
      stroke: var(--cloud-stroke);
      stroke-width: 4.5px;
      stroke-linejoin: round;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.14));
    }

    .cloud-label {
      position: relative;
      z-index: 2;
      text-align: center;
      padding-top: 10px;
    }

    .cloud-label .lvl-code {
      display: block;
      font-size: 1.45rem;
      font-weight: 800;
      color: #000000;
      line-height: 1.1;
    }

    .cloud-label .lvl-name {
      display: block;
      font-family: 'Cairo', sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      color: #000000;
      margin-top: 2px;
    }

    .tasks-view {
      display: none;
      max-width: 1120px;
      margin: 10px auto 0;
      padding: 0 18px;
    }

    .tasks-view.active {
      display: block !important;
    }

    .tasks-header {
      background: var(--card-bg);
      border: 2px solid var(--motivate-border);
      border-radius: 18px;
      padding: 18px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .tasks-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .back-btn {
      background: var(--cloud-fill);
      color: #ffffff;
      border: 2px solid var(--cloud-stroke);
      padding: 8px 16px;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .selected-lvl-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .progress-bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .progress-track {
      flex: 1;
      min-width: 200px;
      height: 11px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #10b981;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .week-block {
      margin-bottom: 32px;
    }

    .week-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--motivate-bg);
      border: 2px solid var(--motivate-border);
      padding: 8px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      color: #0f172a;
      font-weight: 800;
      font-size: 0.92rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    .day-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }

    .day-card.completed {
      border-color: #10b981;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.15);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .day-badge {
      background: #2bb3c0;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.78rem;
      padding: 4px 11px;
      border-radius: 8px;
    }

    .skill-info {
      text-align: right;
    }

    .skill-en {
      display: block;
      font-size: 0.7rem;
      font-weight: 800;
      color: #2bb3c0;
    }

    .skill-ar {
      display: block;
      font-family: 'Cairo', sans-serif;
      font-size: 0.72rem;
      color: var(--text-muted);
      direction: rtl;
    }

    .lesson-head {
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--card-border);
    }

    .lesson-en {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .lesson-ar {
      font-family: 'Cairo', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      color: #2bb3c0;
      direction: rtl;
    }

    .tasks-ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .task-li {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      cursor: pointer;
      padding: 5px;
      border-radius: 8px;
    }

    .task-li:hover {
      background: rgba(43, 179, 192, 0.08);
    }

    .heart-icon {
      font-size: 1.15rem;
      color: #94a3b8;
      line-height: 1.2;
      user-select: none;
    }

    .task-li.done .heart-icon {
      color: #2bb3c0;
    }

    .task-txt-en {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .task-li.done .task-txt-en {
      text-decoration: line-through;
      opacity: 0.65;
    }

    .task-txt-ar {
      font-family: 'Cairo', sans-serif;
      font-size: 0.78rem;
      color: var(--text-muted);
      direction: rtl;
      margin-top: 2px;
    }

    .note-input {
      width: 100%;
      border: none;
      border-bottom: 1.5px dashed var(--card-border);
      background: transparent;
      padding: 6px 4px;
      font-family: inherit;
      font-size: 0.8rem;
      color: var(--text-main);
      outline: none;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="app-logo">StepUp English 🗒️</div>
    <button class="theme-btn" id="theme-btn" type="button">☀️</button>
  </div>

  <div class="home-view" id="home-view">
    <div class="motivation-box">
      <h2>🚀 استمراري اليومي هو سر نجاحي وتفوقي!</h2>
      <p class="encourage-text">ثقي بنفسكِ، فكل خطوة صغيرة تخطينها اليوم تقربكِ أكثر نحو إتقان اللغة بطلاقة وثقة مطلقة. أنتِ لها!</p>
    </div>

    <div class="clouds-stack">
      <button class="cloud-btn" type="button" data-level="A0_A1">
        <svg class="cloud-svg" viewBox="0 0 320 135" preserveAspectRatio="none">
          <path d="M75,118 C40,118 18,98 22,74 C25,54 44,42 66,44 C76,22 104,10 134,15 C154,6 184,8 202,24 C228,18 258,30 266,52 C288,56 304,74 300,94 C296,112 276,118 248,118 Z" />
        </svg>
        <div class="cloud-label">
          <span class="lvl-code">A0 – A1</span>
          <span class="lvl-name">Beginner (المستوى المبتدئ)</span>

      </button>

      <button class="cloud-btn" type="button" data-level="A2_B1">
        <svg class="cloud-svg" viewBox="0 0 320 135" preserveAspectRatio="none">

        <div class="cloud-label">
          <span class="lvl-code">A2 – B1</span>
          <span class="lvl-name">Intermediate (المستوى المتوسط)</span>

      </button>

      <button class="cloud-btn" type="button" data-level="B1_B2">
        <svg class="cloud-svg" viewBox="0 0 320 135" preserveAspectRatio="none">
          <path d="M75,118 C40,118 18,98 22,74 C25,54 44,42 66,44 C76,22 104,10 134,15 C154,6 184,8 202,24 C228,18 258,30 266,52 C288,56 304,74 300,94 C296,112 276,118 248,118 Z" />
        </svg>
        <div class="cloud-label">
          <span class="lvl-code">B1 – B2</span>
          <span class="lvl-name">Advanced (المستوى المتقدم)</span>
        </div>
      </button>
    </div>
  </div>

  <div class="tasks-view" id="tasks-view">
    <div class="tasks-header">
      <div class="tasks-top-row">
        <button class="back-btn" id="back-btn" type="button">← Back to Levels</button>
        <div class="selected-lvl-title" id="selected-lvl-title">A0 – A1 Beginner</div>
      </div>
      <div class="progress-bar-row">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text" id="progress-text">0 / 30 Days Completed (0%)</div>
      </div>
    </div>

    <div id="weeks-container"></div>
  </div>

    let currentLevel = "A0_A1";
    let progressState = {};
    let notesState = {};

    try {
      progressState = JSON.parse(localStorage.getItem("stepup_progress") || "{}");
      notesState = JSON.parse(localStorage.getItem("stepup_notes") || "{}");
    } catch (e) {}

    const themeBtn = document.getElementById("theme-btn");
    const homeView = document.getElementById("home-view");
    const tasksView = document.getElementById("tasks-view");
    const backBtn = document.getElementById("back-btn");

    function applyTheme(isDark) {
      if (isDark) {
        document.body.classList.add("dark-mode");
        themeBtn.textContent = "🌙";
      } else {
        document.body.classList.remove("dark-mode");
        themeBtn.textContent = "☀️";
      }
    }

    try {
      if (localStorage.getItem("stepup_dark") === "1") {
        applyTheme(true);
      }
    } catch (e) {}

    themeBtn.addEventListener("click", () => {
      const isDark = !document.body.classList.contains("dark-mode");
      applyTheme(isDark);
      try {
        localStorage.setItem("stepup_dark", isDark ? "1" : "0");
      } catch (e) {}
    });

    document.querySelectorAll(".cloud-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const lvl = btn.getAttribute("data-level");
        openLevel(lvl);
      });
    });

    backBtn.addEventListener("click", () => {
      tasksView.classList.remove("active");
      homeView.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    function openLevel(lvl) {
      currentLevel = lvl;
      homeView.classList.add("hidden");
      tasksView.classList.add("active");
      document.getElementById("selected-lvl-title").textContent = ROADMAP_DATA[lvl].title;
      renderLevelTasks();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toggleTask(dayNum, taskIdx) {
      const key = `${currentLevel}_d${dayNum}_t${taskIdx}`;
      progressState[key] = !progressState[key];
      try {
        localStorage.setItem("stepup_progress", JSON.stringify(progressState));
      } catch (e) {}
      renderLevelTasks();
    }

    function saveNote(dayNum, val) {
      notesState[`${currentLevel}_d${dayNum}`] = val;
      try {
        localStorage.setItem("stepup_notes", JSON.stringify(notesState));
      } catch (e) {}
    }

    function renderLevelTasks() {
      const data = ROADMAP_DATA[currentLevel];
      const container = document.getElementById("weeks-container");
      container.innerHTML = "";

      let completedDays = 0;

      data.weeks.forEach(w => {
        const weekDiv = document.createElement("div");
        weekDiv.className = "week-block";
        weekDiv.innerHTML = `
          <div class="week-title-bar">
            <span>${w.week}</span>
            <span style="font-family:'Cairo',sans-serif;">${w.weekAr}</span>
          </div>
          <div class="cards-grid"></div>
        `;

        const grid = weekDiv.querySelector(".cards-grid");

        w.days.forEach(d => {
          const allDone = d.tasks.every((_, idx) => progressState[`${currentLevel}_d${d.day}_t${idx}`]);
          if (allDone) completedDays++;

          const card = document.createElement("div");
          card.className = `day-card ${allDone ? "completed" : ""}`;

          const ul = document.createElement("ul");
          ul.className = "tasks-ul";

          d.tasks.forEach((t, idx) => {
            const done = !!progressState[`${currentLevel}_d${d.day}_t${idx}`];
            const li = document.createElement("li");
            li.className = `task-li ${done ? "done" : ""}`;
            li.innerHTML = `
              <span class="heart-icon">${done ? "♥" : "♡"}</span>
              <div>
                <div class="task-txt-en">${t.en}</div>
                <div class="task-txt-ar">${t.ar}</div>
              </div>
            `;
            li.addEventListener("click", () => toggleTask(d.day, idx));
            ul.appendChild(li);
          });

          const topWrap = document.createElement("div");
          topWrap.innerHTML = `
            <div class="card-top">
              <span class="day-badge">DAY ${String(d.day).padStart(2, '0')}</span>
              <div class="skill-info">
                <span class="skill-en">${d.skillEn}</span>
                <span class="skill-ar">${d.skillAr}</span>
              </div>
            </div>
            <div class="lesson-head">
              <div class="lesson-en">${d.titleEn}</div>
              <div class="lesson-ar">${d.titleAr}</div>
            </div>
          `;
          topWrap.appendChild(ul);

          const noteInput = document.createElement("input");
          noteInput.type = "text";
          noteInput.className = "note-input";
          noteInput.placeholder = "Today's note / ملاحظة اليوم...";
          noteInput.value = notesState[`${currentLevel}_d${d.day}`] || "";
          noteInput.addEventListener("input", (e) => saveNote(d.day, e.target.value));

          card.appendChild(topWrap);
          card.appendChild(noteInput);
          grid.appendChild(card);
        });

        container.appendChild(weekDiv);
      });

      const pct = Math.round((completedDays / 30) * 100);
      document.getElementById("progress-fill").style.width = pct + "%";
      document.getElementById("progress-text").textContent = `${completedDays} / 30 Days Completed (${pct}%)`;
    }
  </script>
</body>
</html>
